services:
  edge-worker:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    network_mode: host
    command: airflow edge worker --queues default --concurrency 4
    # DooD: airflow uid(50000)가 host docker gid에 속해야 socket 접근 가능
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
