services:
  edge-worker:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    hostname: mac-server
    command: airflow edge worker --queues gpu,default --concurrency 8
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
