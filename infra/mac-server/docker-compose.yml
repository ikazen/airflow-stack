services:
  edge-worker:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    hostname: mac-server
    command: airflow edge worker --queues gpu,default --concurrency 8
    environment:
      PYTHONPATH: /opt/airflow/lol-list
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - ${LOL_LIST_PATH}:/opt/airflow/lol-list:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
