x-edge-worker: &edge-worker
  build:
    context: ../..
    dockerfile: infra/airflow.Dockerfile
  env_file: .env
  # sleep/wake 후 wake 훅이 force-recreate 시, 좀비 job 을 빠르게 drain·종료해
  # 깨끗이 OFFLINE 등록되도록 (drain_timeout=0 이면 무한 대기 → terminating 에 묶임).
  environment:
    AIRFLOW__EDGE__DRAIN_TIMEOUT_SEC: "10"
    AIRFLOW__EDGE__DRAIN_KILL_GRACE_SEC: "5"
  stop_grace_period: 30s   # drain(10s)+kill_grace(5s) 동안 docker 가 SIGKILL 안 하도록
  # DooD: airflow uid(50000)가 docker gid에 속해야 socket 접근 가능 (Colima VM)
  group_add:
    - "${DOCKER_GID}"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  restart: unless-stopped

# T-shirt sizing: default(경량) / big(gpu,big 공유) 워커 분리.
# GPU task = heavy → big 워커에 묶어 concurrency cap 공유. 워커 이름은
# --edge-hostname 으로 지정 (한 노드 두 워커, 이름 충돌 회피).
services:
  edge-worker-default:
    <<: *edge-worker
    command: airflow edge worker --queues default,mac-server --concurrency 8 --edge-hostname mac-server

  edge-worker-big:
    <<: *edge-worker
    # concurrency 1 -> 2(reflexion-rondo#216, #202의 후속). #202가 4vCPU VM에서
    # concurrency 2로 인한 CPU 경합을 잡으려 1로 낮췄는데, adversarial review에서 이게
    # fleet 전체 big 슬롯을 3(worker-vm 1 + mac-server 2)에서 2로 줄여 매 super-cycle의
    # 3번째 attempt(그 사이클 bandit이 가장 덜 선호한 탐색 슬롯)가 슬롯을 못 얻어
    # 구조적으로 매번 배제되는 부작용을 낳는 걸 확인했다. Colima VM을 4->6vCPU/16->20GB로
    # 먼저 키워(nexus-prime:hosts/mac-server/README.md) attempt당 실제 코어를 늘린
    # 뒤에 되돌리는 것 — #202가 고치려던 경합(기존 4vCPU/2=2코어)보다 지금은 여유가
    # 크다(6vCPU/2=3코어).
    command: airflow edge worker --queues gpu,big --concurrency 2 --edge-hostname mac-server-big
