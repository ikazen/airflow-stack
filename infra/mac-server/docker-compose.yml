services:
  edge-worker:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    hostname: mac-server
    command: airflow edge worker --queues gpu,default --concurrency 8
    # DooD: airflow uid(50000)가 docker gid에 속해야 socket 접근 가능 (Colima VM)
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
