services:
  edge-worker:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    hostname: mac-server
    command: airflow edge worker --queues gpu,default --concurrency 8
    # DooD — @task.docker 가 (Colima VM) docker 로 sibling 컨테이너 기동. socket 그룹 권한은
    # group_add (airflow uid 50000 이 docker gid 그룹에 들어가야 socket 접근 가능).
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
