services:
  airflow-init:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    command: airflow db migrate
    networks:
      - nexus
    # postgres 가 다른 compose (nexus-prime) 에 있어 cross-compose depends_on 불가.
    # postgres 미준비 시 첫 시도 fail → compose 가 재기동 → postgres ready 면 통과.
    restart: on-failure

  api-server:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "${OPS_TAILNET_IP}:8080:8080"
    command: airflow api-server
    volumes:
      - /home/ubuntu/airflow-local/passwords.json:/opt/airflow/local/passwords.json
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow scheduler
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  dag-processor:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow dag-processor
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  triggerer:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow triggerer
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  edge-worker-ops:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__EDGE__API_URL: http://api-server:8080/edge_worker/v1/rpcapi
    hostname: ops-vm
    command: airflow edge worker --queues ops --concurrency 2
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

volumes:
  airflow-logs:

networks:
  nexus:
    external: true
