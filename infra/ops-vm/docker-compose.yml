name: airflow

services:
  airflow-init:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    env_file: .env
    command: airflow db migrate
    networks:
      - nexus
    # postgres 가 다른 compose (nexus-prime) 에 있어 cross-compose depends_on 불가.
    # postgres 미준비 시 첫 시도 fail → compose 가 재기동 → postgres ready 면 통과.
    restart: on-failure

  api-server:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "${OPS_TAILNET_IP}:8080:8080"
    command: airflow api-server
    volumes:
      - /home/ubuntu/airflow-local/passwords.json:/opt/airflow/local/passwords.json
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow scheduler
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  dag-processor:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow dag-processor
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  triggerer:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow triggerer
    volumes:
      - airflow-logs:/opt/airflow/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

  edge-worker-ops:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__EDGE__API_URL: http://api-server:8080/edge_worker/v1/rpcapi
    # DooD: ops 큐 = privileged 인프라 유지보수 전용. docker.sock = 호스트 docker root.
    # airflow uid(50000)가 host docker gid 에 속해야 socket 접근 가능.
    group_add:
      - "${DOCKER_GID}"
    hostname: ops-vm
    command: airflow edge worker --queues ops --concurrency 2
    volumes:
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      # issue #12: reflexion_rondo_deploy DAG의 preflight 태스크가 release.sh와 동일한
      # 진실 소스(nexus 내부용 값 + AIRFLOW_USER/PASSWORD)를 읽을 수 있도록.
      # 이 컨테이너는 uid=50000(airflow) gid=0(root)로 뜬다 — bind mount는 env_file
      # 지시어와 달리 컨테이너 프로세스 자신이 OS 레벨 read 권한을 가져야 하므로,
      # 호스트에서 파일이 root 그룹에 읽기 허용돼 있어야 한다:
      #   sudo chown ubuntu:root /var/lib/rondo/.env && sudo chmod 640 /var/lib/rondo/.env
      # (기본 600/ubuntu:ubuntu면 Permission denied — 재프로비저닝 시 반드시 재적용)
      - /var/lib/rondo/.env:/var/lib/rondo/.env:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - nexus
    restart: unless-stopped

volumes:
  airflow-logs:

networks:
  nexus:
    external: true
