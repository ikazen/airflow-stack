services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: >
      bash -c "
        airflow db migrate &&
        airflow variables import /opt/airflow/config/airflow-variables.json
      "
    volumes:
      - ./airflow-variables.json:/opt/airflow/config/airflow-variables.json:ro
    restart: no

  api-server:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "8080:8080"
    command: airflow api-server
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - ./simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json:rw
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow scheduler
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    restart: unless-stopped

  dag-processor:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    command: airflow dag-processor
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    restart: unless-stopped

  edge-worker-ops:
    build:
      context: ../..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Docker 내부망으로 직결 — Tailscale 경유 불필요
      AIRFLOW__EDGE__API_URL: http://api-server:8080/edge_worker/v1/rpcapi
    hostname: ops-vm
    command: airflow edge worker --queues ops --concurrency 2
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api-server
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
  caddy-data:
  caddy-config:
